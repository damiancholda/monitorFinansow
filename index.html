<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="view-login" class="auth-container">
    <div class="auth-card">
        <header class="auth-header">
            <div class="logo-icon">📊</div>
            <h1>Monitor Zasobów</h1>
            <p class="subtitle">Witaj ponownie!</p>
        </header>

        <form id="login-form" onsubmit="return false;">
            <div class="input-group">
                <label for="login-username">Login</label>
                <input type="text" id="login-username" placeholder="Wpisz swój login" required>
            </div>

            <div class="input-group">
                <label for="login-password">Hasło</label>
                <input type="password" id="login-password" placeholder="Wpisz hasło" required>
            </div>

            <div class="auth-options">
                <label class="checkbox-container">
                    <input type="checkbox" id="remember-me">
                    <span class="checkmark"></span>
                    Zapamiętaj mnie
                </label>
                <a href="#" class="forgot-password">Zapomniałeś hasła?</a>
            </div>

            <p id="login-error" class="error-message"></p>

            <button type="submit" id="btn-login" class="btn-primary">Zaloguj</button>
        </form>
    </div>
</section>
<main class="hidden">

</main>
    

<script src="/js/login.js"></script>
</body>
</html>
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Zasobów</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="login-screen" class="full-screen hidden">
        <div class="login-card">
            <div class="logo">📊</div>
            <h1>Monitor Zasobów</h1>
            <p class="subtitle">Witaj ponownie!</p>

            <form id="login-form">
                <div class="input-group">
                    <label>Login</label>
                    <input type="text" placeholder="Wpisz swój login" required>
                </div>
                <div class="input-group">
                    <label>Hasło</label>
                    <input type="password" placeholder="Wpisz hasło" required>
                </div>
                
                <div class="extra-actions">
                    <label class="checkbox-container">
                        <input type="checkbox"> Zapamiętaj mnie
                    </label>
                    <a href="#" class="forgot-link">Zapomniałeś hasła?</a>
                </div>

                <button type="submit" class="login-btn">Zaloguj</button>
            </form>
        </div>
    </div>

    <div id="dashboard-screen" class="app-container">
        <header class="main-header">
            <div class="avatar">DK</div>
            <div class="date-selector">
                <i class="fas fa-chevron-left"></i>
                <span>Kwiecień 2026</span>
                <i class="fas fa-chevron-right"></i>
            </div>
            <div class="toggle-buttons">
                <button class="active">Osobiste</button>
                <button>Grupa</button>
            </div>
        </header>

        <section class="main-card">
            <p class="label">BUDŻET MIESIĘCZNY</p>
            <h1>1 800 zł</h1>
            <div class="progress-bar"><div class="progress-fill" style="width: 69%;"></div></div>
        </section>
        <nav class="bottom-nav">
            <div class="nav-item active"><i class="fas fa-th-large"></i><span>Dashboard</span></div>
            <div class="nav-item"><i class="fas fa-book"></i><span>Dziennik</span></div>
            <div class="add-btn"><i class="fas fa-plus"></i></div>
            <div class="nav-item"><i class="fas fa-archive"></i><span>Magazyn</span></div>
            <div class="nav-item"><i class="fas fa-chart-bar"></i><span>Raporty</span></div>
        </nav>
    </div>
</body>
</html>
